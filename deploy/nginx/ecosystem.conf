server {
    listen 80;
    server_name ВАШ-ДОМЕН;

    # --- ФинИгроСкоп: корень ---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;          # загрузка .docx
        # шаг конвейера ждёт ответа модели; короткий таймаут обрывает страницу
        proxy_read_timeout 300s;
    }

    # --- Генератор игр ---
    #
    # Слэш в конце ОБЯЗАТЕЛЕН с обеих сторон: он срезает префикс, и генератор
    # получает запрос так, будто стоит в корне. Его страница ходит в свой API по
    # ОТНОСИТЕЛЬНЫМ адресам (generator/app.js: 'api/generate/mechanics'), поэтому
    # из-под /generator/ запрос соберётся в /generator/api/... и придёт сюда же.
    location /generator/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Генерация идёт синхронно и занимает до минуты — короткий таймаут
        # оборвёт запрос ровно тогда, когда модель уже начала отвечать.
        proxy_read_timeout 300s;
    }

    # Без завершающего слэша браузер считает базой корень домена, и относительный
    # 'api/generate/mechanics' ушёл бы в /api/... то есть в ФинИгроСкоп. Поэтому
    # адрес без слэша не обслуживаем, а перенаправляем.
    location = /generator {
        return 301 /generator/;
    }
}
