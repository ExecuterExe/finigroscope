{% extends "base.html" %}

{% block title %}ФинИгроСкоп — анализ вашей игры под микроскопом{% endblock %}

{% block content %}
<section class="hero">
    <div class="hero-inner">
        <h1 class="hero-title">ФинИгроСкоп</h1>
        <p class="hero-tagline">Анализ вашей игры под микроскопом</p>

        <div class="hero-actions">
            <a class="btn btn-primary btn-lg" href="{{ url_for('dashboard') }}">Открыть кабинет</a>
        </div>
    </div>
</section>

<section class="stages">
    <h2 class="section-title">Три этапа</h2>
    <div class="stage-grid">
        <article class="stage-card">
            <div class="stage-num">01</div>
            <h3>Документный этап</h3>
        </article>

        <article class="stage-card">
            <div class="stage-num">02</div>
            <h3>Симуляционный этап</h3>
        </article>

        <article class="stage-card">
            <div class="stage-num">03</div>
            <h3>Содержательный этап</h3>
        </article>
    </div>
</section>
{% endblock %}
