# Развёртывание экосистемы на Render (Blueprint).
#
# Два веб-сервиса из одного репозитория: ФинИгроСкоп и «Генератор игр». Каждый
# живёт в своей папке и ставит свои зависимости — общего у них только этот файл
# и группа переменных.
#
# ЧТО НУЖНО СДЕЛАТЬ РУКАМИ ПОСЛЕ ПЕРВОГО ДЕПЛОЯ (два поля, оба обязательные):
#
#   1. OPENROUTER_API_KEY — в группе переменных ecosystem-shared.
#   2. LENS_API_URL у сервиса generator — полный адрес ФинИгроСкопа, который
#      Render выдаст после создания: https://finigroskop-XXXX.onrender.com
#      Автоматически подставить нельзя: Render умеет отдать только host, а
#      клиенту нужен адрес со схемой.
#
# ЧЕСТНО ПРО БЕСПЛАТНЫЙ ТАРИФ. Он годится для показа и не годится для работы:
#
#   • Сервис засыпает после 15 минут простоя и просыпается около минуты.
#   • Очередь задач генератора живёт В ПАМЯТИ, а вход в следующий этап — номер
#     задачи. Сон или перезапуск стирают её: незаконченный конвейер придётся
#     начинать заново, и это снова платные вызовы модели.
#   • Диск эфемерный. База ФинИгроСкопа (SQLite) обнуляется при каждом деплое.
#     Постоянные диски на Render платные; с ними нужно задать FINIGROSKOP_DB
#     путём на смонтированный диск.
#
# Под постоянную работу этого конвейера предназначен VPS — конфигурация для
# него лежит в deploy/ (nginx + systemd).

envVarGroups:
  - name: ecosystem-shared
    envVars:
      # Ключ модели. Один на оба сервиса: агенты генератора и оценщик по линзам
      # ходят к одному провайдеру.
      - key: OPENROUTER_API_KEY
        sync: false          # вписать в панели Render, в репозиторий не класть
      # Общий секрет эндпоинта линз. Генерируется один раз и виден обоим
      # сервисам — ровно то, что нужно: значения обязаны совпадать, а
      # придумывать и копировать их руками незачем.
      - key: LENS_API_TOKEN
        generateValue: true

services:
  # ---------------------------------------------------------------- ФинИгроСкоп
  - type: web
    name: finigroskop
    runtime: python
    plan: free
    rootDir: finigroskop
    buildCommand: pip install -r requirements.txt
    # ОДИН воркер. Очередь фоновых задач живёт ВНУТРИ процесса: при нескольких
    # воркерах у каждого будет своя, и статус задачи придёт не от того процесса,
    # который её считает. Больше одного — только вместе с настоящей очередью.
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 900 app:app
    healthCheckPath: /
    envVars:
      - fromGroup: ecosystem-shared
      - key: PYTHON_VERSION
        value: "3.11.4"
      # Ключ подписи сессий. Без него используется общеизвестное значение по
      # умолчанию, и подделать сессию сможет кто угодно.
      - key: FINIGROSKOP_SECRET
        generateValue: true
      # FINIGROSKOP_RESET ЗДЕСЬ НЕ ЗАДАВАТЬ. Эта переменная разрешает стереть
      # хранилище при старте; на сервере она означает потерю всех документов
      # при каждом перезапуске.
      #
      # ИТОГОВЫЙ РАЗБОР ИГРЫ. Последний шаг конвейера («Проверить игру целиком»)
      # проводит её через симуляционный этап, а тот прогоняет КОД, НАПИСАННЫЙ
      # МОДЕЛЬЮ. Это единственное место сервиса, где такое происходит, поэтому
      # оно закрыто отдельным разрешением и по умолчанию ВЫКЛЮЧЕНО.
      #
      # Без него разбор честно откажется на первом же шаге — до единого
      # обращения к модели, ничего не потратив. Так и задумано: включать
      # удалённое выполнение чужого кода молча нельзя.
      #
      # Чтобы разбор заработал, поставьте значение 1 в панели Render. Взвесьте:
      # сервис на бесплатном тарифе доступен из интернета всем, а токен
      # LENS_API_TOKEN закрывает вход, но не последствия ошибки в самом коде.
      # Для показа это приемлемо; для постоянной работы разбор лучше держать на
      # VPS, где контейнер изолирован (конфигурация в deploy/).
      - key: SIM_API_ALLOW_RUN
        sync: false

  # ------------------------------------------------------------- Генератор игр
  - type: web
    name: generator
    runtime: python
    plan: free
    rootDir: generator
    buildCommand: pip install -r requirements.txt
    # Не gunicorn: сервер генератора — не WSGI-приложение, а собственный
    # обработчик http.server. Адрес и порт он берёт из окружения (config.bind).
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - fromGroup: ecosystem-shared
      - key: PYTHON_VERSION
        value: "3.11.4"
      # Адрес ФинИгроСкопа для вызовов сервер-сервер. Вписать после первого
      # деплоя: https://<имя сервиса>.onrender.com
      - key: LENS_API_URL
        sync: false
      # Адрес для КНОПКИ в шапке страницы. Его открывает браузер пользователя,
      # поэтому он может отличаться от LENS_API_URL — и обычно совпадает.
      - key: FINIGROSKOP_URL
        sync: false
      # Сторож автоперезагрузки на сервере не нужен: процессом управляет
      # платформа. Признак хостинга (переменная PORT) выключает его и сам,
      # но явное значение надёжнее молчаливого умолчания.
      - key: GENERATOR_AUTORELOAD
        value: "0"
